# 本番 (Oracle Cloud) 用の構成。手順は docs/deploy-oracle-cloud.md を参照。
#   cd deploy && docker compose up -d --build
# 設定は deploy/.env から読む (deploy/setup.sh で作る)。
# 外への公開のしかたは、deploy/.env の COMPOSE_FILE でこのファイルに重ねるファイルで決まる。
#   compose.relay.yml: 別のサーバー (中継用のサーバー) から逆プロキシする (サーバーの間は HTTPS)
#   compose.proxy.yml: 同じサーバーの Web サーバー (Apache など) から逆プロキシする
#   compose.caddy.yml: Caddy が 80 / 443 番で直接公開し、証明書も自動で取得する
name: orbit

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# API サーバー、同期ワーカー、マイグレーションで共通の設定。
x-server: &server
  image: orbit-server
  build:
    context: ..
    target: server
    args:
      # 版とコミット (deploy/deploy.sh が決める)。手で docker compose build したときは空 (版は 0.0.0-dev)。
      ORBIT_VERSION: ${ORBIT_BUILD_VERSION:-}
      ORBIT_COMMIT: ${ORBIT_BUILD_COMMIT:-}
  restart: unless-stopped
  init: true
  logging: *logging
  # deploy/.env に書いた値はそのまま届く。下の environment は、ドメインなどから決まる値で上書きする。
  env_file: .env
  environment: &server-env
    DATABASE_URL: postgres://orbit:${POSTGRES_PASSWORD:?deploy/.env に POSTGRES_PASSWORD がありません (deploy/setup.sh を実行してください)}@postgres:5432/orbit
    API_PORT: "8787"
    # 公開された HTTPS の URL なので、Microsoft Graph の変更通知 (Webhook) が自動で有効になる。
    API_PUBLIC_URL: https://${DOMAIN:?deploy/.env に DOMAIN がありません}
    ALLOWED_ORIGINS: https://${DOMAIN},${EXTRA_ALLOWED_ORIGINS:-}
    MICROSOFT_REDIRECT_URI: https://${DOMAIN}/oauth/microsoft
    GOOGLE_REDIRECT_URI: https://${DOMAIN}/oauth/google
    # プッシュサービスが運営者へ連絡するための宛先。既定は公開している URL。
    VAPID_SUBJECT: ${VAPID_SUBJECT:-https://${DOMAIN}}
    ALLOW_PRIVATE_MAIL_HOSTS: "false"
    # API が受け取った添付ファイルをワーカーが読むので、同じボリュームを両方に付ける。
    ATTACHMENTS_DIR: /data/attachments
    # アプリ本体の配布用のファイル (deploy/app-releases/、docs/updates.md)。
    APP_RELEASES_DIR: /data/app-releases
    TZ: ${TZ:-Asia/Tokyo}

services:
  postgres:
    image: postgres:19
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orbit
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 起動のたびに未適用のマイグレーションを流して終了する。API とワーカーはこれが済んでから起動する。
  migrate:
    <<: *server
    restart: "no"
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    command: ["node", "apps/api/dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachments:/data/attachments
      # アプリ本体の配布用のファイル。API はどの版を配るかを読むだけ。
      - ./app-releases:/data/app-releases:ro,z
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *server
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachments:/data/attachments

  web:
    image: orbit-web
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
      # アプリの画面の自動更新の一覧に署名する鍵 (deploy/app-update-key.sh が作る)。イメージには残らない。
      secrets:
        - app_update_signing_key
    restart: unless-stopped
    logging: *logging
    # 待ち受けるアドレスとポートは、重ねるファイル (compose.relay.yml / compose.proxy.yml / compose.caddy.yml) が決める。
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      # アプリ本体の配布用のファイル (/app-update/releases/ で配る)。
      - ./app-releases:/data/app-releases:ro,z
    depends_on:
      - api

  # 毎日 1 回、DB を deploy/backups/ に書き出す。BACKUP_PUBLIC_KEY があれば、その公開鍵で暗号化する。
  backup:
    image: postgres:19
    restart: unless-stopped
    logging: *logging
    entrypoint: ["bash", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: orbit
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: orbit
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PUBLIC_KEY: ${BACKUP_PUBLIC_KEY:-}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      # 末尾の z は SELinux が有効なホスト (AlmaLinux など) でコンテナから読めるようにする指定。
      - ./backup.sh:/backup.sh:ro,z
      - ./backups:/backups:z
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  attachments:

secrets:
  app_update_signing_key:
    file: ./secrets/app-update-signing-key
