# 本番 (Oracle Cloud) 用の構成。手順は docs/deploy-oracle-cloud.md を参照。
#   cd deploy && docker compose up -d --build
# 設定は deploy/.env から読む (deploy/setup.sh で作る)。
name: mail

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# API サーバー、同期ワーカー、マイグレーションで共通の設定。
x-server: &server
  image: mail-server
  build:
    context: ..
    target: server
  restart: unless-stopped
  init: true
  logging: *logging
  # deploy/.env に書いた値はそのまま届く。下の environment は、ドメインなどから決まる値で上書きする。
  env_file: .env
  environment: &server-env
    DATABASE_URL: postgres://mail:${POSTGRES_PASSWORD:?deploy/.env に POSTGRES_PASSWORD がありません (deploy/setup.sh を実行してください)}@postgres:5432/mail
    API_PORT: "8787"
    # 公開された HTTPS の URL なので、Microsoft Graph の変更通知 (Webhook) が自動で有効になる。
    API_PUBLIC_URL: https://${DOMAIN:?deploy/.env に DOMAIN がありません}
    ALLOWED_ORIGINS: https://${DOMAIN},${EXTRA_ALLOWED_ORIGINS:-}
    MICROSOFT_REDIRECT_URI: https://${DOMAIN}/oauth/microsoft
    ALLOW_PRIVATE_MAIL_HOSTS: "false"
    # API が受け取った添付ファイルをワーカーが読むので、同じボリュームを両方に付ける。
    ATTACHMENTS_DIR: /data/attachments
    TZ: ${TZ:-Asia/Tokyo}

services:
  postgres:
    image: postgres:19
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mail
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 起動のたびに未適用のマイグレーションを流して終了する。API とワーカーはこれが済んでから起動する。
  migrate:
    <<: *server
    restart: "no"
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    command: ["node", "apps/api/dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachments:/data/attachments
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *server
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachments:/data/attachments

  web:
    image: mail-web
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 取得した証明書。消すと取り直しになり、Let's Encrypt の発行回数の制限に当たることがある。
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  # 毎日 1 回、DB を deploy/backups/ に書き出す。
  backup:
    image: postgres:19
    restart: unless-stopped
    logging: *logging
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: mail
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: mail
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  attachments:
  caddy-data:
  caddy-config:
