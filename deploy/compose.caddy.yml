# Caddy が 80 / 443 番で直接公開する場合に、compose.yml に重ねる (ほかの Web サーバーが 80 / 443 番を使っていない環境向け)。
# 証明書は Caddy が Let's Encrypt から自動で取得・更新する。
services:
  web:
    environment:
      SITE_ADDRESS: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 取得した証明書。消すと取り直しになり、Let's Encrypt の発行回数の制限に当たることがある。
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
