# 既存の Apache (httpd) からメールアプリへ逆プロキシする設定の見本。
# orbit.example.com を自分のドメインに置き換えて /etc/httpd/conf.d/orbit.conf に置く
# (手順は docs/deploy-oracle-cloud.md)。
#
# ここには 80 番の設定だけを書く。HTTPS (443 番) の設定は、certbot --apache が
# この設定を写して作り、80 番から HTTPS への転送も足してくれる。
<VirtualHost *:80>
    ServerName orbit.example.com

    # コンテナ側 (Caddy) は Host と元のプロトコルを見るので、そのまま伝える。
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # 添付ファイル (1 通あたり合計 25 MB まで) を受け取れるようにする。
    LimitRequestBody 52428800

    # Web と API のどちらもコンテナの web (127.0.0.1:18080) へ渡す。振り分けはコンテナ側で行う。
    # flushpackets=on は、変更の通知 (SSE、/v1/events) をため込まずにすぐ流すための指定。
    # ポートを変えた場合 (deploy/.env の LOCAL_PORT) は、ここも合わせる。
    ProxyPass        / http://127.0.0.1:18080/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:18080/

    ErrorLog  logs/orbit_error.log
    CustomLog logs/orbit_access.log combined
</VirtualHost>
