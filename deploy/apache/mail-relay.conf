# 中継用のサーバー (Linode) の Apache (httpd) から、Oracle Cloud のサーバーへ中継する設定の見本。
# 既存のサイトの設定 (例: /etc/httpd/conf.d/natsuki-api.lunaproject.jp.conf) を写して作るのが確実で、
# このファイルは「メールアプリで必要になる指定」を示すためのもの (手順は docs/deploy-oracle-cloud.md)。
#
#   mail.example.com  公開するドメイン
#   ORACLE_HOST       Oracle Cloud のサーバーのアドレス (既存のサイトの設定で使っているものと同じ)
#
# 既存のサイトが 443 番 (<VirtualHost *:443> と SSLCertificateFile など) で受けている場合は、
# VirtualHost の行と SSL の指定を、既存のサイトの設定と同じにする。
<VirtualHost *:80>
    ServerName mail.example.com

    ProxyRequests Off
    # Oracle Cloud 側の Apache はドメイン名でメールアプリへ振り分けるので、Host をそのまま渡す。
    # これが無いと、Oracle Cloud 側で別のサイト (既定のサイト) に繋がる。
    ProxyPreserveHost On

    # 添付ファイル (1 通あたり合計 25 MB まで) を受け取れるようにする。
    LimitRequestBody 52428800

    # 変更の通知 (SSE、/v1/events) は繋ぎっぱなしで、25 秒ごとに空のイベントが流れる。
    # 既定 (60 秒) より短くしている場合だけ問題になるので、明示しておく。
    ProxyTimeout 120

    # flushpackets=on は、変更の通知をため込まずにすぐ流すための指定。
    ProxyPass        / http://ORACLE_HOST/ flushpackets=on
    ProxyPassReverse / http://ORACLE_HOST/

    ErrorLog  logs/mail_error.log
    CustomLog logs/mail_access.log combined
</VirtualHost>
