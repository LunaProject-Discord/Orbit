# 中継用のサーバー (Linode) の Apache (httpd) から、Oracle Cloud のサーバーへ中継する設定の見本。
# 既存のサイトの設定と同じ形 (80 番は HTTPS へ転送、443 番で受けて Oracle Cloud のアプリのポートへ中継) にしてある。
# Oracle Cloud 側は deploy/setup.sh <ドメイン> relay で、18080 番 (deploy/.env の LOCAL_PORT) を HTTPS で待ち受ける。
# サーバーの間はインターネットを通るので、ここも HTTPS で繋ぎ、相手が Oracle Cloud のサーバーであることを証明書で確かめる。
# 手順は docs/deploy-oracle-cloud.md。
#
#   mail.example.com  公開するドメイン
#   ORACLE_HOST       Oracle Cloud のサーバーのアドレス (既存のサイトの設定で使っているものと同じ)
#   証明書のパス       既存のサイトの設定と同じものにする (新しいドメインを含む証明書であること)
#   orbit-relay.crt   Oracle Cloud のサーバーの deploy/certs/relay.crt を写したもの (秘密鍵の relay.key は写さない)
<VirtualHost *:80>
    ServerName mail.example.com

    RewriteEngine on
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName mail.example.com:443

    SSLEngine on
    SSLHonorCipherOrder on
    SSLCompression off
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5:!SEED:!IDEA:!3DES:!RC4:!DH

    SSLCertificateFile /etc/letsencrypt/live/example.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/example.com/fullchain.pem

    # 添付ファイル (1 通あたり合計 25 MB まで) を受け取れるようにする。
    LimitRequestBody 52428800

    # timeout=120:     変更の通知 (SSE、/v1/events) は繋ぎっぱなしで、25 秒ごとに空のイベントが流れる。
    #                  30 秒などの短い値だと余裕が無い。
    # flushpackets=on: 変更の通知をため込まずにすぐ流す。
    ProxyPass        / https://ORACLE_HOST:18080/ retry=0 timeout=120 flushpackets=on
    ProxyPassReverse / https://ORACLE_HOST:18080/

    # Oracle Cloud のサーバーとの間を HTTPS にする。
    # 信頼するのは写してきた証明書 1 枚だけなので、その秘密鍵を持つ Oracle Cloud のサーバー以外には繋がらない
    # (経路の途中で盗み見たり、なりすましたりできない)。
    # 証明書そのものを指定して相手を確かめているので、名前の照合は切っておく
    # (向き先を IP アドレスで書いても、ドメインを変えても、同じ設定のまま使えるようにするため)。
    SSLProxyEngine on
    SSLProxyVerify require
    SSLProxyCACertificateFile /etc/httpd/conf/orbit-relay.crt
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerExpire on
    SSLProxyProtocol all -SSLv3 -TLSv1 -TLSv1.1
    # 既存のサイトと同じく、Host をそのまま渡す。
    ProxyPreserveHost on
</VirtualHost>
