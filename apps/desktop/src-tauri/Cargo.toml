[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit Mail のデスクトップ版"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# Windows の通知 (トースト) に返信欄を付けるため、WinRT の通知 API を直接使う (src/toast.rs)。
# 版は、通知のプラグインが使っているもの (Cargo.lock) と合わせる。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Data_Xml_Dom",
  "UI_Notifications",
  # タイトルバーの右クリックで出す、OS のシステムメニュー (src/system_menu.rs)。
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
