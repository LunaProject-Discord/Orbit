name: Android

# Android アプリ (apps/mobile) をビルドする。
# - プルリクエストと main: apps/mobile を変えたときに、確認用のアプリ (debug) を作る。
# - 手動 (Run workflow): 最新の画面 (apps/web) を入れたアプリを作り直す。
# - リリース (.github/workflows/release.yml から呼ばれる): その版の配布用のアプリ (APK) と android.json を作り、
#   成果物 release-android として渡す (GitHub Releases へは release.yml がまとめて載せる)。
# 署名鍵と Firebase の設定は、リポジトリのシークレットから渡す。無くてもビルドは通り、
# その場合は確認用のアプリだけができて、プッシュ通知は使えない。
# 準備の手順は docs/android-app.md を参照。
on:
  pull_request:
    paths:
      - apps/mobile/**
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - .github/workflows/android.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: リリースの版 (例 1.2.0)
        type: string
        required: true

concurrency:
  group: android-${{ github.ref }}${{ inputs.version && '-release' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # アプリが最初に接続するサーバー。アプリの「接続先サーバー」の画面で後から変えられる。
      NEXT_PUBLIC_API_URL: ${{ vars.MOBILE_SERVER_URL || 'https://orbit.lunaproject.jp' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
      RELEASE_VERSION: ${{ inputs.version || '' }}
      # Google Play は、出すたびに大きい番号を求める。リリース以外は実行番号をそのまま使う
      # (リリースは版から決める。下の「版の名前を決める」)。
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # 画面の自動更新の一覧の署名を確かめる公開鍵 (docs/app-update.md)。無ければ画面を更新しないアプリになる。
      APP_UPDATE_PUBLIC_KEY: ${{ vars.APP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - run: pnpm install --frozen-lockfile

      - name: 版の名前を決める
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            echo "ANDROID_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"
            echo "ANDROID_VERSION_CODE=$(node scripts/android-version-code.mjs "$RELEASE_VERSION")" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_NAME=0.1.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: 画面 (apps/web) をビルドして Android プロジェクトへ入れる
        run: pnpm --filter @orbit/mobile android:prepare

      - name: Firebase の設定を置く (プッシュ通知用)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json

      - name: 署名鍵を置く
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 確認用のアプリ (debug) をビルド
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: 配布用のアプリ (release) をビルド
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # apk は端末へ直接入れる用、aab は Google Play へ出す用。
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: 署名鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: orbit-mail-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: orbit-mail-android-release
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # リリースでは、サーバーが配る APK と、その情報 (android.json、apps/api/src/lib/app-releases.ts) を渡す。
      # 端末に入れたアプリを入れ替えるには毎回同じ鍵で署名する必要があるので、署名鍵が無いときは載せない。
      - name: リリース用にファイルを集める
        if: env.RELEASE_VERSION != '' && env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          apk="$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n 1)"
          name="Orbit-Mail-Android_${RELEASE_VERSION}.apk"
          cp "$apk" "$RUNNER_TEMP/release/$name"
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, writeFileSync } = require("node:fs");
            const [dir, name, version, versionCode] = process.argv.slice(1);
            const data = readFileSync(`${dir}/${name}`);
            writeFileSync(`${dir}/android.json`, JSON.stringify({
              version, versionCode: Number(versionCode), file: name,
              sha256: createHash("sha256").update(data).digest("hex"), size: data.length,
            }, null, 2) + "\n");
          ' "$RUNNER_TEMP/release" "$name" "$RELEASE_VERSION" "$ANDROID_VERSION_CODE"
          cat "$RUNNER_TEMP/release/android.json"

      - name: リリースに載せられないことを知らせる
        if: env.RELEASE_VERSION != '' && env.HAS_KEYSTORE != 'true'
        run: echo "::warning::署名鍵 (ANDROID_KEYSTORE_BASE64) が無いので、Android の APK はリリースに載せません。"

      - uses: actions/upload-artifact@v7
        if: env.RELEASE_VERSION != '' && env.HAS_KEYSTORE == 'true'
        with:
          name: release-android
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7
