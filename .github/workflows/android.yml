name: Android

# Android アプリ (apps/mobile) をビルドする。
# - プルリクエストと main: apps/mobile を変えたときに、確認用のアプリ (debug) を作る。
# - 手動 (Run workflow): 最新の画面 (apps/web) を入れたアプリを作り直す。
# - タグ android-v*: 配布用のアプリを作る (例: android-v0.1.0)。
# 署名鍵と Firebase の設定は、リポジトリのシークレットから渡す。無くてもビルドは通り、
# その場合は確認用のアプリだけができて、プッシュ通知は使えない。
# 準備の手順は docs/android-app.md を参照。
on:
  pull_request:
    paths:
      - apps/mobile/**
      - .github/workflows/android.yml
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - apps/mobile/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # アプリが最初に接続するサーバー。アプリの「接続先サーバー」の画面で後から変えられる。
      NEXT_PUBLIC_API_URL: ${{ vars.MOBILE_SERVER_URL || 'https://orbit.lunaproject.jp' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
      # Google Play は、出すたびに大きい番号を求める。実行番号をそのまま使う。
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: 版の名前を決める
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "ANDROID_VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_NAME=0.1.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: 画面 (apps/web) をビルドして Android プロジェクトへ入れる
        run: pnpm --filter @orbit/mobile android:prepare

      - name: Firebase の設定を置く (プッシュ通知用)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json

      - name: 署名鍵を置く
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 確認用のアプリ (debug) をビルド
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: 配布用のアプリ (release) をビルド
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # apk は端末へ直接入れる用、aab は Google Play へ出す用。
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: 署名鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-mail-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: orbit-mail-android-release
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
