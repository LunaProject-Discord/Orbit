name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: マイグレーションを適用
        run: pnpm db:migrate
      - name: 主キーが UUID v7 で採番されることを確認
        run: |
          version=$(psql "$DATABASE_URL" -qAtc "insert into users (email, name) values ('ci@example.com', 'CI') returning uuid_extract_version(id)")
          echo "UUID version: $version"
          test "$version" = "7"

  # 本番用の構成 (deploy/) でイメージをビルドし、実際に起動できることを確認する。
  # 本番のサーバーは arm64 (Oracle Cloud の Ampere A1) なので、arm64 でも確認する。
  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7
      - name: 設定ファイルを用意 (別のサーバーから逆プロキシする構成)
        run: |
          bash setup.sh orbit.example.com relay
          grep -x 'LOCAL_BIND=0.0.0.0' .env
          grep -x 'COMPOSE_FILE=compose.yml:compose.relay.yml' .env
          # サーバーの間の HTTPS に使う証明書ができていて、作り直されないこと。
          openssl x509 -in certs/relay.crt -noout -ext subjectAltName | grep -q 'DNS:orbit.example.com'
          before="$(sha256sum certs/relay.crt)"
          bash setup.sh
          test "$before" = "$(sha256sum certs/relay.crt)"
      - name: ほかの構成も検証
        run: |
          COMPOSE_FILE=compose.yml:compose.caddy.yml docker compose config --quiet
          COMPOSE_FILE=compose.yml:compose.proxy.yml docker compose config --quiet
      - name: イメージをビルド
        run: docker compose build
      - name: 起動
        run: docker compose up -d
      - name: Web と API が HTTPS で応答することを確認
        run: |
          # 中継用のサーバーと同じく、作った証明書だけを信頼して繋ぐ。
          fetch() { curl --cacert certs/relay.crt --resolve orbit.example.com:18080:127.0.0.1 "$@"; }
          base=https://orbit.example.com:18080
          for _ in $(seq 1 30); do
            if fetch -fsS "$base/healthz"; then
              echo
              fetch -fsS -o /dev/null -w 'login: %{http_code}\n' "$base/login"
              fetch -fsS -o /dev/null -w 'v1: %{http_code}\n' "$base/v1"
              # 変更の通知 (SSE) には、手前の逆プロキシにため込ませないための指定が付く。
              fetch -sS -D - -o /dev/null "$base/v1/events" | grep -i '^x-accel-buffering: no'
              # 平文の HTTP では中身を返さない。
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = 400
              # アプリの画面の自動更新: 一覧が署名付きで配信され、一覧のファイルが HTML としてではなく、
              # 一覧の SHA-256 と同じ中身で取得できる (docs/app-update.md)。
              fetch -fsS "$base/app-update/manifest.json" -o "$RUNNER_TEMP/manifest.json"
              fetch -fsS -D - -o "$RUNNER_TEMP/index.html" "$base/app-update/files/index.html" |
                grep -i '^content-type: application/octet-stream'
              expected="$(python3 -c 'import json,sys; p=json.loads(json.load(open(sys.argv[1]))["payload"]); print(next(f["sha256"] for f in p["files"] if f["path"] == "/index.html"))' "$RUNNER_TEMP/manifest.json")"
              test "$(sha256sum "$RUNNER_TEMP/index.html" | cut -d' ' -f1)" = "$expected"
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=50
          exit 1
      - name: バックアップを 1 回取る (暗号化なし)
        run: |
          docker compose run --rm backup once
          sudo sh -c 'ls backups/orbit-*.dump'
      - name: バックアップを暗号化して取り、戻す
        run: |
          docker compose exec -T postgres psql -U orbit -d orbit -q \
            -c "create table backup_check (v text); insert into backup_check values ('before');"
          bash backup-key.sh >"$RUNNER_TEMP/secret-key.asc"
          grep -q '^BACKUP_PUBLIC_KEY=.' .env
          docker compose run --rm backup once
          file="$(sudo sh -c 'ls backups/orbit-*.dump.gpg')"
          # 中身がそのまま読める形で入っていないこと。
          if sudo grep -q PGDMP "$file"; then exit 1; fi
          docker compose exec -T postgres psql -U orbit -d orbit -q -c "update backup_check set v = 'after';"
          # 別の鍵では戻せず、DB もそのまま。
          cp .env "$RUNNER_TEMP/env"
          bash backup-key.sh --renew >"$RUNNER_TEMP/other-key.asc"
          cp "$RUNNER_TEMP/env" .env
          if echo yes | sudo bash restore.sh "$file" "$RUNNER_TEMP/other-key.asc"; then exit 1; fi
          test "$(docker compose exec -T postgres psql -U orbit -d orbit -Atc 'select v from backup_check')" = after
          # 正しい鍵なら戻る。
          echo yes | sudo bash restore.sh "$file" "$RUNNER_TEMP/secret-key.asc"
          test "$(docker compose exec -T postgres psql -U orbit -d orbit -Atc 'select v from backup_check')" = before
