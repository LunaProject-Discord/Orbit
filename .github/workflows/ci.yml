name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: mail
          POSTGRES_PASSWORD: mail
          POSTGRES_DB: mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mail -d mail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mail:mail@localhost:5432/mail
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: マイグレーションを適用
        run: pnpm db:migrate
      - name: 主キーが UUID v7 で採番されることを確認
        run: |
          version=$(psql "$DATABASE_URL" -qAtc "insert into users (email, name) values ('ci@example.com', 'CI') returning uuid_extract_version(id)")
          echo "UUID version: $version"
          test "$version" = "7"

  # 本番用の構成 (deploy/) でイメージをビルドし、実際に起動できることを確認する。
  # 本番のサーバーは arm64 (Oracle Cloud の Ampere A1) なので、arm64 でも確認する。
  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: 設定ファイルを用意 (既存の Web サーバーから逆プロキシする構成)
        run: bash setup.sh mail.example.com apache
      - name: Caddy が直接公開する構成も検証
        run: COMPOSE_FILE=compose.yml:compose.caddy.yml docker compose config --quiet
      - name: イメージをビルド
        run: docker compose build
      - name: 起動
        run: docker compose up -d
      - name: Web と API が応答することを確認
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              echo
              curl -fsS -o /dev/null -w 'login: %{http_code}\n' http://127.0.0.1:18080/login
              curl -fsS -o /dev/null -w 'v1: %{http_code}\n' http://127.0.0.1:18080/v1
              # 変更の通知 (SSE) には、手前の逆プロキシにため込ませないための指定が付く。
              curl -sS -D - -o /dev/null http://127.0.0.1:18080/v1/events | grep -i '^x-accel-buffering: no'
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=50
          exit 1
      - name: バックアップを 1 回取る
        run: docker compose run --rm backup once
